# Couche 0, étape 5 : le référentiel des secteurs d'activité.
#
# Nomenclature de laboratoire. Ce n'est ni la NAEMA ni aucune classification
# officielle : si le projet doit un jour dialoguer avec des données réelles,
# il faudra la remplacer et documenter la table de correspondance.
#
# observable  -> code, libelle, cycle
# latent      -> tout le bloc parametres, qui pilote le moteur économique

secteurs:

  - code: COMMERCE
    libelle: "Commerce de détail"
    cycle: continu
    parametres:
      recettes_mensuelles_medianes: 250000
      marge_structurelle: 0.12
      amplitude_saisonniere: 0.20
      mois_pic: 12
      volatilite_base: 0.18

  - code: AGRICULTURE
    libelle: "Production agricole"
    cycle: tres_saisonnier
    parametres:
      recettes_mensuelles_medianes: 180000
