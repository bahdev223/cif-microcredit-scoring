      taux_defaut_experimental_cible: 0.07
      multiplicateur_montant: 1.15
      decalage_discipline: 0.05
      decalage_volatilite: -0.02
      sensibilite_macro: 0.80
      facteur_qualite_donnees: 0.70
      rotation_annuelle_agents: 0.06
