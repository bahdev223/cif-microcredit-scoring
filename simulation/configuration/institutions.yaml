# Couche 0, étape 1 : les cinq institutions fictives du laboratoire.
#
# Chaque institution définit un environnement complet dans lequel vivront ses
# clients. Les cinq portefeuilles sont volontairement contrastés : c'est ce qui
# permettra de tester si un même moteur de scoring s'adapte à des
# environnements différents, ou s'il n'apprend que le monde qui l'a vu naître.
#
# Deux blocs par institution :
#   observable  -> écrit dans donnees/synthetiques/brutes/01_institutions.csv
#   latent      -> écrit dans donnees/synthetiques/verite/ et jamais donné au modèle
#
# Aucun de ces chiffres n'est une statistique du secteur de la microfinance
# malienne. Ce sont des paramètres de laboratoire, choisis pour produire des
# contrastes exploitables, et documentés comme tels.

version_referentiel: "1.0.0"
pays_de_demonstration: "Mali"

institutions:

  - code_profil_portefeuille: URBAIN_COMMERCE
    libelle: "Institution 001 - commerce urbain"
    zone_dominante: urbaine
    specialisation_principale: COMMERCE
    date_agrement: "2006-03-15"
    # Portefeuille de ville : cycles courts, montants plus élevés, peu de
    # saisonnalité, exposition faible aux chocs agricoles.
    latent:
      nombre_clients_cible: 10000
      nombre_agences: 8
      clients_par_agent_cible: 320
      part_clients_stock_initial: 0.22
      croissance_annuelle_portefeuille: 0.12
      severite_octroi: 0.55
